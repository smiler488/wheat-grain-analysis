name: test
on: [push, pull_request]
jobs:
  octave:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends octave octave-image
      - run: octave --no-gui --eval "run('tests/test_analyze_grains.m')"
